spring.application.name=healthcare

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clinical_decision_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# JWT Configuration
security.jwt.secret=${JWT_SECRET:change-this-secret-in-production-very-long-and-random-key-for-clinical-decision-system}
security.jwt.expiration-ms=3600000

# Development seed data
app.seed-default-doctor=${APP_SEED_DEFAULT_DOCTOR:false}
app.default-doctor.email=${APP_DEFAULT_DOCTOR_EMAIL:doctor@example.com}
app.default-doctor.password=${APP_DEFAULT_DOCTOR_PASSWORD:password123}
app.default-doctor.name=${APP_DEFAULT_DOCTOR_NAME:Dr. John Smith}
app.default-doctor.specialization=${APP_DEFAULT_DOCTOR_SPECIALIZATION:General Medicine}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=INFO
